<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1c2c" />
  <title>HyoDS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.2/dist/galmuri.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 홈 화면 -->
    <section id="home" class="screen active">
      <header class="topbar">
        <h1 class="logo">HyoDS</h1>
        <button id="nickBtn" class="chip">플레이어</button>
      </header>

      <div class="hero pixel-box">
        <canvas id="heroArt" width="64" height="32"></canvas>
        <div>
          <p class="hero-title">오늘도 한 판!</p>
          <p class="hero-sub">친구들과 최고 점수를 겨뤄 보세요</p>
        </div>
      </div>

      <h2 class="section-title">▶ 게임 고르기</h2>
      <ul id="gameList" class="game-grid"></ul>

      <nav class="tabbar">
        <button class="tab active" data-tab="home">🏠<span>홈</span></button>
        <button class="tab" data-tab="rank">🏆<span>순위</span></button>
        <button class="tab" data-tab="me">👾<span>내 정보</span></button>
      </nav>
    </section>

    <!-- 게임 화면 -->
    <section id="play" class="screen">
      <header class="play-top">
        <button id="backBtn" class="chip">◀ 나가기</button>
        <span id="playTitle"></span>
        <span id="playScore" class="score">0</span>
      </header>
      <div id="stage"><canvas id="gameCanvas"></canvas></div>
      <div id="overlay" class="overlay hidden">
        <div class="pixel-box overlay-box">
          <p id="ovTitle" class="ov-title"></p>
          <p id="ovText" class="ov-text"></p>
          <button id="ovBtn" class="btn">시작</button>
        </div>
      </div>
    </section>

    <!-- 닉네임 입력 -->
    <div id="nickModal" class="overlay hidden">
      <div class="pixel-box overlay-box">
        <p class="ov-title">이름을 정해 주세요</p>
        <input id="nickInput" maxlength="8" placeholder="최대 8글자" />
        <button id="nickSave" class="btn">확인</button>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
