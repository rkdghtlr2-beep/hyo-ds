<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1c2c" />
  <title>HyoDS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.2/dist/galmuri.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 홈 화면 -->
    <section id="home" class="screen active">
      <header class="topbar">
        <h1 class="logo">HyoDS</h1>
        <button id="nickBtn" class="chip">플레이어</button>
      </header>

      <div class="hero pixel-box">
        <canvas id="heroArt" width="64" height="32"></canvas>
        <div>
          <p class="hero-title">오늘도 한 판!</p>
          <p class="hero-sub">친구들과 최고 점수를 겨뤄 보세요</p>
        </div>
      </div>

      <h2 class="section-title">▶ 게임 고르기</h2>
      <ul id="gameList" class="game-grid"></ul>

      <nav class="tabbar">
        <button class="tab active" data-tab="home">🏠<span>홈</span></button>
        <button class="tab" data-tab="rank">🏆<span>순위</span></button>
        <button class="tab" data-tab="me">👾<span>내 정보</span></button>
      </nav>
    </section>

    <!-- 게임 화면 -->
    <section id="play" class="screen">
      <header class="play-top">
        <button id="backBtn" class="chip">◀ 나가기</button>
        <span id="playTitle"></span>
        <span id="playScore" class="score">0</span>
      </header>
      <!-- 게임기 본체: 위쪽 화면 + 아래쪽 조작부 (조작부는 필요한 게임에서만 보임) -->
      <div id="console" class="console">
        <div class="screen-bezel">
          <div id="stage"><canvas id="gameCanvas"></canvas></div>
        </div>
        <div class="hinge"></div>
        <div id="pad" class="pad">
          <div id="dpad" class="dpad">
            <span class="arm up" data-dir="up"></span>
            <span class="arm right" data-dir="right"></span>
            <span class="arm down" data-dir="down"></span>
            <span class="arm left" data-dir="left"></span>
            <span class="hub"></span>
          </div>
          <div class="abtns">
            <button class="abtn a" data-key="A">A</button>
            <button class="abtn b" data-key="B">B</button>
            <button class="abtn c" data-key="C">C</button>
            <button class="abtn d" data-key="D">D</button>
          </div>
        </div>
        <p id="padLegend" class="pad-legend"></p>
      </div>
      <div id="overlay" class="overlay hidden">
        <div class="pixel-box overlay-box">
          <p id="ovTitle" class="ov-title"></p>
          <p id="ovText" class="ov-text"></p>
          <button id="ovBtn" class="btn">시작</button>
          <!-- 게임이 끝났을 때만 보이는 버튼 -->
          <div id="ovSub" class="btn-row hidden">
            <button id="ovRank" class="btn btn-sub">순위 보기</button>
            <button id="ovExit" class="btn btn-sub">나가기</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 순위 -->
    <div id="rankModal" class="overlay hidden">
      <div class="pixel-box overlay-box">
        <p id="rankTitle" class="ov-title">순위</p>
        <ol id="rankList" class="rank-list"></ol>
        <p class="rank-note">지금은 이 기기의 기록만 보여요</p>
        <button id="rankClose" class="btn">닫기</button>
      </div>
    </div>

    <!-- 닉네임 입력 -->
    <div id="nickModal" class="overlay hidden">
      <div class="pixel-box overlay-box">
        <p class="ov-title">이름을 정해 주세요</p>
        <input id="nickInput" maxlength="8" placeholder="최대 8글자" />
        <button id="nickSave" class="btn">확인</button>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
